name: audio_waveforms_gdx_plus
description: Community-maintained Flutter plugin for recording, playing, extracting, and displaying customizable audio waveforms.
version: 2.1.0
homepage: https://gurwinderdevx.com
repository: https://github.com/47gurvinder/audio_waveforms
issue_tracker: https://github.com/47gurvinder/audio_waveforms/issues
funding:
  - https://buymeacoffee.com/gurwinderdevx

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.simform.audio_waveforms
        pluginClass: AudioWaveformsPlugin
      ios:
        pluginClass: AudioWaveformsPlugin
      macos:
        pluginClass: AudioWaveformsPlugin
