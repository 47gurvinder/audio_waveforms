name: Feature request
description: Suggest an improvement for audio_waveforms_gdx_plus
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Existing request
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
  - type: textarea
    attributes:
      label: Problem or use case
      description: What problem would this feature solve, and who would benefit?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternatives you have considered.
  - type: textarea
    attributes:
      label: Additional context
      description: Add code samples, screenshots, or links that clarify the request.
